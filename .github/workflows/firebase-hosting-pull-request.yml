name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. Descargar e instalar Flutter en el servidor de GitHub
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 2. Descargar las librerías de tu proyecto
      - run: flutter pub get
      
      # 3. Compilar la versión web
      - run: flutter build web
      
      # 4. Desplegar a Firebase (Esto ya lo generó Firebase, déjalo como está)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVENTARIOS_UNIVERSAL }}'
          projectId: inventarios-universal
          channelId: live
      
